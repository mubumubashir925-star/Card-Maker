name: Card Maker Pro - Build DLLs
on:
  workflow_dispatch:
  push:
    paths:
      - 'CardMakerPro/**'
      - '.github/workflows/cardmakerpro-build.yml'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build WPF host
        shell: pwsh
        run: msbuild CardMakerPro/CardMakerPro.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal
      - name: Verify compiled host DLL
        shell: pwsh
        run: |
          $dll = "CardMakerPro/src/CardMakerPro.Host/bin/Release/CardMakerPro.Host.dll"
          if (-not (Test-Path $dll)) { throw "Host DLL missing: $dll" }
          Write-Host "Compiled host: $dll"
      - name: Stage preview installer files
        shell: pwsh
        run: |
          $stage = "CardMakerPro/installer/staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "CardMakerPro/src/CardMakerPro.Host/bin/Release/CardMakerPro.Host.dll" $stage
          Copy-Item "CardMakerPro/src/CardMakerPro.UI/bin/Release/CardMakerPro.UI.dll" $stage
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --version=6.2.2 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install Inno Setup 6.2.2" }
          $compiler = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
      - name: Build preview setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "CardMakerPro/installer/CardMakerPro.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
      - name: Upload preview installer
        uses: actions/upload-artifact@v4
        with:
          name: CardMakerPro-Preview-Installer
          path: CardMakerPro/installer/output/CardMakerPro-Preview-Setup.exe
          if-no-files-found: error
      - name: Upload DLL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CardMakerPro-Host-Libraries
          path: |
            CardMakerPro/src/CardMakerPro.Host/bin/Release/**
            CardMakerPro/src/CardMakerPro.UI/bin/Release/**
          if-no-files-found: error
